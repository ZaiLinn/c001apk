plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}


def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def _filePath = System.getenv("KEYSTORE") ?: keystoreProperties["storeFile"]
def _storeFile = _filePath != null ? file(_filePath) : null
def _storePassword = System.getenv("KEYSTORE_PASSWORD") ?: System.getenv("REVIA_KS_PASS") ?: keystoreProperties["storePassword"]
def _keyAlias = System.getenv("KEY_ALIAS") ?: keystoreProperties["keyAlias"]
def _keyPassword = System.getenv("KEY_PASSWORD") ?: System.getenv("REVIA_KS_PASS") ?: keystoreProperties["keyPassword"]
def _hasReleaseSigning = _storeFile != null && _storeFile.isFile() && _storePassword && _keyAlias && _keyPassword

android {
    namespace = "app.awavenue.c001apk"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.zailinn.c001apk"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if(_hasReleaseSigning) {
            release {
                storeFile _storeFile
                storePassword _storePassword
                keyAlias _keyAlias
                keyPassword _keyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (_hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Never produce an unsigned or debug-signed release when credentials are missing.
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    doFirst {
        if (!_hasReleaseSigning) {
            throw new GradleException("Release signing is not configured. Set KEYSTORE, KEY_ALIAS and KEYSTORE_PASSWORD/KEY_PASSWORD (or REVIA_KS_PASS); see docs/DEVELOPMENT.md.")
        }
    }
}

flutter {
    source = "../.."
}
