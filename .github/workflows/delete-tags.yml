name: Delete tags

# Removes tags left behind by deleted releases. Only tags without a release are
# deleted; a tag that still has a release is reported and kept.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: Space-separated tag names, e.g. "2.0.3-release 2.0.4-release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          status=0
          for tag in $TAGS; do
            if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9._-]+$'; then
              echo "Skipping invalid tag name: $tag"; status=1; continue
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Keeping $tag: it still has a release"; status=1; continue
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" && echo "Deleted $tag"
            else
              echo "No tag $tag"
            fi
          done
          exit $status
