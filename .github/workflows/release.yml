name: Release

# Push a tag such as 2.0.0-release or v2.0.0 to build the signed APK and publish
# a GitHub Release. The tag must match c001apk.versionName in gradle.properties.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-release'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Run from a tag (select it under "Use workflow from") to retry a failed release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag || { echo 'Run this workflow from a release tag'; exit 1; }
          tag_version=$(printf '%s' "$TAG" | sed -E 's/^v//; s/-release$//')
          echo "$tag_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Unsupported tag: $TAG"; exit 1; }
          app_version=$(sed -n 's/^c001apk.versionName=//p' gradle.properties | tr -d '\r')
          test "$tag_version" = "$app_version" || {
            echo "Tag $TAG does not match c001apk.versionName $app_version"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; delete it first to publish again"; exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$TAG" "$tag_version" >> "$GITHUB_OUTPUT"

  android:
    name: Android
    needs: verify
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [verify, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: c001apk-release
          path: release
      - name: Check assets
        run: |
          ls release/c001apk-*-android-universal.apk >/dev/null
          cat release/SHA256SUMS.txt
      - name: Write release notes
        run: |
          {
            echo "## 下载"
            echo
            echo "下载 \`c001apk-*-android-universal.apk\` 安装即可，适用于所有 Android 7.0 及以上设备。"
            echo
            echo "从 1.x（Flutter 版）升级：可直接覆盖安装；新版本不读取旧版数据，需要重新登录，设置、历史和黑名单需重新配置。"
            echo
            echo "校验值见 \`SHA256SUMS.txt\`。"
          } > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "c001apk $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --latest
