name: Release

# Builds the signed APK and publishes a GitHub Release whose notes are the
# version's section in CHANGELOG.md. Either push a tag such as 2.0.0-release or
# v2.0.0 (it must match c001apk.versionName in gradle.properties), or run the
# workflow from main: it then creates the <version>-release tag itself.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-release'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      replace:
        description: Replace an existing Release or leftover tag of the same version (rebuild without a version bump)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          REPLACE: ${{ inputs.replace || false }}
        run: |
          app_version=$(sed -n 's/^c001apk.versionName=//p' gradle.properties | tr -d '\r')
          echo "$app_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Unsupported version: $app_version"; exit 1; }
          if [ "$REF_TYPE" = tag ]; then
            tag_version=$(printf '%s' "$TAG" | sed -E 's/^v//; s/-release$//')
            test "$tag_version" = "$app_version" || {
              echo "Tag $TAG does not match c001apk.versionName $app_version"; exit 1; }
          else
            TAG="$app_version-release"
          fi
          awk -v v="$app_version" '$0 == "## " v {on=1; next} on && /^## / {exit} on' CHANGELOG.md | grep -q '[^[:space:]]' || {
            echo "CHANGELOG.md has no section for $app_version"; exit 1; }
          if [ "$REPLACE" != true ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; run with replace to publish it again"; exit 1
          fi
          # A tag left behind by a deleted release would pin the new release to old code.
          if [ "$REF_TYPE" != tag ] && [ "$REPLACE" != true ] &&
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; run with replace to move it to this commit"; exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$TAG" "$app_version" >> "$GITHUB_OUTPUT"

  android:
    name: Android
    needs: verify
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [verify, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: c001apk-release
          path: release
      - name: Check assets
        run: |
          ls release/c001apk-*-android-universal.apk >/dev/null
          cat release/SHA256SUMS.txt
      - name: Write release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The version's CHANGELOG.md section, without its heading.
          awk -v v="$VERSION" '$0 == "## " v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPLACE: ${{ inputs.replace || false }}
        run: |
          if [ "$REPLACE" = true ]; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
            fi
          fi
          # Creates the tag on this commit when the run was started from a branch.
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "c001apk $VERSION" \
            --notes-file notes.md \
            --latest
